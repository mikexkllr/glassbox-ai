name: Release

# Builds installers for macOS, Windows and Linux on every push to main and
# publishes them to a GitHub Release. The shipped app (electron-updater) reads
# that release feed and auto-updates itself in the background.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# electron-builder needs to create releases / upload assets.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate the whole release on the types. `electron-vite build` only strips
  # types, so without this a type error ships to everyone as a new version.
  check:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    # Mapped to env here, not read inline, so the steps below can branch on
    # whether the secrets exist: `secrets` is not available in a step `if`.
    env:
      MAC_SIGNED: ${{ secrets.MAC_CSC_LINK != '' }}
      # All three, not just one: electron-builder throws outright when APPLE_ID
      # is present and the app-specific password is not, so a half-configured
      # account would fail the whole macOS build instead of simply shipping
      # unnotarized. Hand the trio over together or not at all.
      MAC_NOTARIZED: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Derive a monotonically increasing version from the workflow run number,
      # keeping major.minor from package.json (e.g. 0.1.<run_number>). Every
      # push to main therefore ships a strictly newer version so clients update.
      - name: Compute version
        id: version
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="${BASE}.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          node -e "const f='package.json',p=require('./'+f);p.version='$VERSION';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          echo "Building version $VERSION"

      - name: Build renderer + main
        run: npm run build

      # --publish always uploads installers + the latest*.yml update feeds to a
      # DRAFT GitHub Release tagged v<version>. The finalize job publishes it
      # once all three platforms have uploaded their artifacts.
      #
      # The CSC_*/APPLE_* vars only do anything on macOS. electron-builder
      # imports the certificate from CSC_LINK (a base64 .p12) into a throwaway
      # keychain, signs the app with it, then uploads it to Apple's notary
      # service and staples the ticket. They are empty until the secrets are set
      # up (docs/signing.md); CSC_IDENTITY_AUTO_DISCOVERY then switches signing
      # off cleanly instead of letting the build fail halfway through.
      - name: Package & publish (${{ matrix.name }})
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CSC_LINK is NOT mac-only to electron-builder — on Windows it would
          # be used as the Authenticode certificate. Hand it over on macOS only,
          # or the day the mac secret exists the Windows build starts failing.
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.MAC_SIGNED }}
          APPLE_ID: ${{ env.MAC_NOTARIZED == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ env.MAC_NOTARIZED == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.MAC_NOTARIZED == 'true' && secrets.APPLE_TEAM_ID || '' }}
          # Windows Authenticode. electron-builder reads these on Windows only,
          # and ignores them while they are empty. See docs/signing.md.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # Catch a half-signed mac build here rather than letting users meet it as
      # "Glassbox is damaged" — and because an unsigned app cannot auto-update.
      - name: Verify the macOS signature
        if: matrix.os == 'macos-latest' && env.MAC_SIGNED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r app; do
            found=1
            echo "::group::$app"
            codesign --verify --deep --strict "$app"
            codesign -d --verbose=2 "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier)='
            if [ "${MAC_NOTARIZED}" = "true" ]; then
              # The ticket has to be stapled into the bundle, otherwise a Mac
              # that is offline or has never seen the app still blocks it.
              xcrun stapler validate "$app"
            fi
            echo "::endgroup::"
          done < <(find dist -maxdepth 2 -name '*.app')
          [ "$found" = 1 ] || { echo "no .app found under dist/"; exit 1; }

      - name: Note that the macOS build is not notarized
        if: matrix.os == 'macos-latest' && env.MAC_SIGNED == 'true' && env.MAC_NOTARIZED != 'true'
        shell: bash
        run: |
          echo "::warning title=macOS build signed but not notarized::Set APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID (see docs/signing.md). Gatekeeper will still warn on a Mac that has never seen this app."

      - name: Note that the macOS build is unsigned
        if: matrix.os == 'macos-latest' && env.MAC_SIGNED != 'true'
        shell: bash
        run: |
          echo "::warning title=Unsigned macOS build::Set the MAC_CSC_LINK / APPLE_* secrets (see docs/signing.md). Until then macOS warns that Glassbox is from an unidentified developer, and the app cannot auto-update itself."

  finalize:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="${BASE}.${{ github.run_number }}"
          gh release edit "v${VERSION}" --draft=false --latest --repo "${{ github.repository }}"
          echo "Published release v${VERSION}"
